name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  PNPM_VERSION: 10.32.1
  NODE_VERSION: 24

jobs:
  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: mkdir release
      - run: pnpm run pack:root release
      - run: pnpm --dir editors/vscode install --frozen-lockfile
      - run: pnpm --dir editors/vscode run package
      - run: node --experimental-strip-types --no-warnings scripts/inspect-vsix.ts
      - run: cp editors/vscode/polici-language.vsix release/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable
          path: release/*
          if-no-files-found: error

  wasi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: 0.15.2
      - uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
        with:
          version: 48.0.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:wasm-fixture
      - run: pnpm run test:runtime
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wasi
          path: |
            examples/runtime/wasm/runtime.wasm
            examples/runtime/wasm/runtime.wasm.source.sha256
          if-no-files-found: error

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-arm64
            os: ubuntu-24.04
          - target: linux-x64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: 0.15.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:native-packages ${{ matrix.target }}
      - run: mkdir release
      - run: npm pack ./dist/packages/polici-${{ matrix.target }} --pack-destination release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  native-macos:
    strategy:
      fail-fast: false
      matrix:
        target: [darwin-arm64, darwin-x64]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: 0.15.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:native-packages ${{ matrix.target }}
      - run: mkdir release
      - run: npm pack ./dist/packages/polici-${{ matrix.target }} --pack-destination release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [portable, wasi, native, native-macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release/*
          fail_on_unmatched_files: true

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [portable, native, native-macos]
    runs-on: ubuntu-24.04
    environment: npm
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release
          merge-multiple: true
      - run: |
          version="${GITHUB_REF_NAME#v}"
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            package="release/polici-polici-${target}-${version}.tgz"
            test -f "$package"
            npm publish "$package" --provenance --access public
          done
          root="release/polici-${version}.tgz"
          test -f "$root"
          npm publish "$root" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-vscode:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [portable]
    runs-on: ubuntu-24.04
    environment: vscode-marketplace
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: |
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(node -p 'require("./editors/vscode/package.json").version')"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: portable
          path: release
      - run: pnpm --dir editors/vscode install --frozen-lockfile
      - run: pnpm --dir editors/vscode exec vsce publish --packagePath ../../release/polici-language.vsix --pat "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
